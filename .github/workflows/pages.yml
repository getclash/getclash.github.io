name: Validate GitHub Pages source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build static pages
        run: npm run build
      - name: Verify content and internal links
        run: npm run check
      - name: Verify committed root files match the build
        run: node scripts/export-pages.mjs --check
